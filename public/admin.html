<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CC Checker — Admin Dashboard</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:20px}
    .card{padding:12px;border:1px solid #ddd;border-radius:6px;margin-bottom:12px}
  </style>
</head>
<body>
  <h1>Admin — Analytics Dashboard</h1>
  <div id="stats" class="card">Loading stats...</div>
  <div id="gateways" class="card">Loading gateways...</div>

  <script>
    async function load(){
      const s = await fetch('/api/admin/stats').then(r=>r.json());
      if(s.success){ document.getElementById('stats').innerText = JSON.stringify(s.stats,null,2) }
      const g = await fetch('/api/admin/gateways').then(r=>r.json());
      if(g.success){ document.getElementById('gateways').innerText = JSON.stringify(gatewaysToSimple(g.gateways),null,2) }
    }
    function gatewaysToSimple(arr){ return arr.map(x=>({id:x.id,name:x.name,slug:x.slug,enabled:x.enabled})) }
    load();
  </script>
</body>
</html>
