version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=cc_checker_db
      - POSTGRES_USER=cc_user
      - POSTGRES_PASSWORD=cc_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgres://cc_user:cc_pass@db:5432/cc_checker_db
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  db_data:
